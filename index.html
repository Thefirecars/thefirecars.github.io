// Raster layers: the original remains locked underneath editable transparent layers.
class FarmsieLayerStack {
 constructor(width,height,base,factory=()=>document.createElement('canvas')){
  this.width=width;this.height=height;this.factory=factory;this.base=this.surface();this.base.getContext('2d').drawImage(base,0,0);this.layers=[];this.activeId=null;this.serial=0;
 }
 surface(){const c=this.factory();c.width=this.width;c.height=this.height;return c;}
 add(name='Paint layer',blend='source-over'){
  if(this.layers.length>=8)throw Error('This picture has 8 layers. Delete a layer before adding another.');
  const layer={id:'layer-'+(++this.serial),name,visible:true,opacity:1,blend,canvas:this.surface()};this.layers.push(layer);this.activeId=layer.id;return layer;
 }
 get active(){return this.layers.find(l=>l.id===this.activeId);}
 render(ctx){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,this.width,this.height);ctx.drawImage(this.base,0,0);
  for(const l of this.layers){if(!l.visible)continue;ctx.globalAlpha=l.opacity;ctx.globalCompositeOperation=l.blend;ctx.drawImage(l.canvas,0,0);}ctx.restore();
 }
 snapshot(){return {width:this.width,height:this.height,serial:this.serial,activeId:this.activeId,layers:this.layers.map(({canvas,...meta})=>({...meta,pixels:canvas.getContext('2d').getImageData(0,0,this.width,this.height)}))};}
 restore(state){if(!state||state.width!==this.width||state.height!==this.height)return;this.serial=state.serial;this.activeId=state.activeId;this.layers=state.layers.map(({pixels,...meta})=>{const canvas=this.surface();canvas.getContext('2d').putImageData(pixels,0,0);return {...meta,canvas};});}
 duplicate(id){const source=this.layers.find(l=>l.id===id);const copy=this.add(source.name+' copy',source.blend);copy.visible=source.visible;copy.opacity=source.opacity;copy.canvas.getContext('2d').drawImage(source.canvas,0,0);return copy;}
 remove(id){this.layers=this.layers.filter(l=>l.id!==id);if(this.activeId===id)this.activeId=this.layers.at(-1)?.id||null;if(!this.layers.length)this.add();}
 move(id,delta){const from=this.layers.findIndex(l=>l.id===id),to=Math.max(0,Math.min(this.layers.length-1,from+delta));if(from<0)return;this.layers.splice(to,0,this.layers.splice(from,1)[0]);}
 serialize(){const activeId=this.activeId,serial=this.serial;const tasks=this.layers.map(({canvas,...meta})=>new Promise((resolve,reject)=>canvas.toBlob(png=>png?resolve({...meta,png}):reject(Error('Could not save a layer')),'image/png')));return Promise.all(tasks).then(layers=>({version:1,activeId,serial,layers}));}
 async load(saved,decode=createImageBitmap){if(saved?.version!==1||!Array.isArray(saved.layers)||saved.layers.length>8||!saved.layers.length)throw Error('Invalid saved layers');const loaded=[];
  for(const {png,...meta} of saved.layers){const bitmap=await decode(png),canvas=this.surface();canvas.getContext('2d').drawImage(bitmap,0,0);bitmap.close?.();loaded.push({...meta,canvas});}
  this.layers=loaded;this.serial=saved.serial;this.activeId=loaded.some(l=>l.id===saved.activeId)?saved.activeId:loaded.at(-1).id;
 }
}
if(typeof window!=='undefined')window.FarmsieLayerStack=FarmsieLayerStack;
if(typeof module!=='undefined')module.exports=FarmsieLayerStack;

</script>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            if (tg.isVersionAtLeast?.('7.7')) tg.disableVerticalSwipes?.();
        }

        const canvas = document.getElementById('coloring-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        // Keep original IDs 24–28 so previously saved coloring remains accessible.
        let currentPage = 24;
        let totalPages = 5;
        const pageImages = {
            24: "jesus_mary_at_cross.png",
            25: "three_crosses_calvary.png",
            26: "jesus_praying.png",
            27: "jesus_carries_cross.png",
            28: "saint_michael_archangel.png",
        };
        const pageDetails = {"24": {"name": "Mary at the Foot of the Cross", "tags": "virgin mary jesus crucifixion mother sorrow calvary"}, "25": {"name": "The Three Crosses at Calvary", "tags": "jesus crucifixion golgotha thieves three crosses"}, "26": {"name": "Jesus Prays", "tags": "jesus prayer kneeling jerusalem"}, "27": {"name": "Jesus Carries the Cross", "tags": "jesus passion via dolorosa cross"}, "28": {"name": "Saint Michael the Archangel", "tags": "michael archangel angels sword shield spiritual battle"}};
        let selectedColor = [255, 59, 48, 255];
        const baseImage = new Image();
        let boundaryMask = null;
        let maskWidth = 0;
        let maskHeight = 0;

        function buildBoundaryMask() {
            const offscreen = document.createElement('canvas');
            offscreen.width = baseImage.width;
            offscreen.height = baseImage.height;
            const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
            offCtx.drawImage(baseImage, 0, 0);

            const imgData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
            const data = imgData.data;
            const width = imgData.width;
            const height = imgData.height;
            const initialMask = new Uint8Array(width * height);

            // Detect dark outline pixels from the original line art.
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const alpha = data[idx + 3];
                const brightness = (r + g + b) / 3;

                // Treat darker/gray anti-aliased pixels as boundaries too.
                if (alpha > 0 && brightness < 220) {
                    initialMask[i] = 1;
                }
            }

            // Expand boundary 1 pixel in every direction to seal tiny gaps.
            const expandedMask = new Uint8Array(initialMask);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const pos = y * width + x;
                    if (initialMask[pos] === 1) {
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nx = x + dx;
                                const ny = y + dy;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    expandedMask[ny * width + nx] = 1;
                                }
                            }
                        }
                    }
                }
            }

            boundaryMask = expandedMask;
            maskWidth = width;
            maskHeight = height;
        }

        // Step 5: Keep each page's colored artwork in this browser's IndexedDB.
        // The original images remain in the repository; no server or account is required.
        const progressDBName = 'farmsie-progress-v1';
        const progressStoreName = 'pages';
        let progressDBPromise = null;
        let pageLoadGeneration = 0;
        let pageReady = false;
        let saveQueue = Promise.resolve();

        function progressKey(pageNumber) {
            // Changing an image filename starts fresh progress for that image.
            return pageDetails[pageNumber]?.importId ? `import|${pageDetails[pageNumber].importId}` : `${pageNumber}|${Number(pageNumber)>=24 ? 'images/'+pageImages[pageNumber] : pageImages[pageNumber]}`;
        }

        function openProgressDB() {
            if (!progressDBPromise) {
                progressDBPromise = new Promise((resolve, reject) => {
                    if (!('indexedDB' in window)) {
                        reject(new Error('Browser storage is unavailable'));
                        return;
                    }
                    const request = indexedDB.open(progressDBName, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(progressStoreName)) {
                            db.createObjectStore(progressStoreName);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
            return progressDBPromise;
        }

        async function restorePageProgress(pageNumber, generation) {
            try {
                // Wait for earlier coloring taps to finish saving before restoring.
                await saveQueue;
                if (generation !== pageLoadGeneration) return;
                const db = await openProgressDB();
                const saved = await new Promise((resolve, reject) => {
                    const transaction = db.transaction(progressStoreName, 'readonly');
                    const store=transaction.objectStore(progressStoreName);
                    const request = store.get(progressKey(pageNumber));
                    request.onsuccess = () => {
                      if(request.result || !pageDetails[pageNumber]?.importId){resolve(request.result);return;}
                      const cursor=store.openCursor();cursor.onerror=()=>reject(cursor.error);
                      cursor.onsuccess=()=>{const row=cursor.result;if(!row){resolve(null);return;}if(String(row.key).endsWith('|'+pageDetails[pageNumber].importId)){resolve(row.value);return;}row.continue();};
                    };
                    request.onerror = () => reject(request.error);
                });
                if (!saved || saved.width !== canvas.width || saved.height !== canvas.height) return null;
                const bitmap = await createImageBitmap(saved.png);
                if (generation === pageLoadGeneration && currentPage === pageNumber) {
                    ctx.drawImage(bitmap, 0, 0);
                }
                bitmap.close();
                return saved;
            } catch (error) {
                console.warn('Farmsie: could not restore saved coloring progress:', error);
            }
        }

        function autoSaveCurrentPage() {
            if (!pageReady || !boundaryMask) return;
            const key = progressKey(currentPage);
            const width = canvas.width;
            const height = canvas.height;
            // Capture before navigating away; chain writes to preserve tap order.
            const pngPromise = new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            const layerPromise = window.farmsieSerializeLayers?.() || Promise.resolve(null);
            layerPromise.catch(()=>{});
            saveQueue = saveQueue.catch(() => {}).then(async () => {
                const [png,layers] = await Promise.all([pngPromise,layerPromise]);
                if (!png) throw new Error('Could not snapshot canvas');
                const db = await openProgressDB();
                await new Promise((resolve, reject) => {
                    const transaction = db.transaction(progressStoreName, 'readwrite');
                    transaction.objectStore(progressStoreName).put({ png, width, height, layers }, key);
                    transaction.oncomplete = resolve;
                    transaction.onerror = () => reject(transaction.error);
                    transaction.onabort = () => reject(transaction.error);
                });
            }).catch(error => {
                console.warn('Farmsie: automatic save unavailable:', error);
                window.dispatchEvent(new CustomEvent('farmsie-save-error',{detail:'Could not save on this device. Export PNG to keep a copy.'}));
            });
        }

        function loadBookPage(num) {
            window.farmsieBeforePageChange?.();
            currentPage = num;
            const generation = ++pageLoadGeneration;
            pageReady = false;
            boundaryMask = null;
            document.getElementById('page-title').innerText = `${pageDetails[num].name} • ${Object.keys(pageImages).map(Number).indexOf(num)+1}/${Object.keys(pageImages).length}`;
            baseImage.onload = async () => {
                if (generation !== pageLoadGeneration) return;
                canvas.width = baseImage.width;
                canvas.height = baseImage.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(baseImage, 0, 0);
                buildBoundaryMask();
                const saved = await restorePageProgress(num, generation);
                if(generation!==pageLoadGeneration)return;
                await window.farmsieInitLayers?.(saved,generation);
                if (generation === pageLoadGeneration) {
    pageReady = true;

    if (typeof window.umami?.track === 'function') {
        window.umami.track(`Picture ${num} loaded`);
    }
                }
            };
            baseImage.onerror = () => {
                if (generation === pageLoadGeneration) {
                    console.warn('Farmsie: could not load', pageImages[num]);
                }
            };
            baseImage.src = pageImages[num];
        }

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const active = document.querySelector('.color-btn.active');
                if (active) active.classList.remove('active');
                e.target.classList.add('active');
                selectedColor = e.target.getAttribute('data-color').match(/\d+/g).map(Number);
            });
        });

        function changePage(direction) {
            const pages=Object.keys(pageImages).map(Number).sort((a,b)=>a-b);
            const at=pages.indexOf(currentPage);loadBookPage(pages[(at+direction+pages.length)%pages.length]);
        }

        function fillRegion(startX, startY, fillColor) {
            if (!boundaryMask || startX < 0 || startX >= maskWidth || startY < 0 || startY >= maskHeight) return;

            const startPos = startY * maskWidth + startX;
            if (boundaryMask[startPos] === 1) return; // Don't color black outlines.

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const startIdx = startPos * 4;

            // If already this exact fill color, do nothing.

                        pos + 1,

    if (gesture.tool === 'move') {
      panX += loc.x - gesture.local.x;
      panY += loc.y - gesture.local.y;
      renderView();
    } else if (gesture.tool === 'transform') {
      if(floating){
        floating.x=Math.max(0,Math.min(art.width-floating.w,floating.x+here.x-gesture.p.x));
        floating.y=Math.max(0,Math.min(art.height-floating.h,floating.y+here.y-gesture.p.y));drawFloating();
      }else if(selectionStart){
        boxAt(Math.min(selectionStart.x,here.x),Math.min(selectionStart.y,here.y),Math.abs(here.x-selectionStart.x),Math.abs(here.y-selectionStart.y));
      }
    } else if (gesture.tool !== 'eyedropper' && valid(here) && layers?.active?.visible) {
      startStroke(); stroke(gesture.p, here);
    }
    gesture.p = here; gesture.local = loc;
  });
  function finish(e, cancelled = false) {
    if (!touches.has(e.pointerId)) return;
    touches.delete(e.pointerId);
    if (pinch) {
      if (touches.size >= 2) enterPinch();
      else if (!touches.size) pinch = null;
      return;
    }
    if (!gesture) return;
    if (cancelled) { cancelStroke(); return; }
    const p = point(e);
    if(pageReady && gesture.tool==='transform'){
      if(selectionStart){selectArea(selectionStart,{x:Math.max(0,Math.min(art.width,p.x)),y:Math.max(0,Math.min(art.height,p.y))});selectionStart=null;}
    }else if(pageReady && gesture.tool==='eyedropper' && valid(p)){
      const picked=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
      selectedColor=[picked[0],picked[1],picked[2],255];
      tools.querySelector('#farmsie-custom-color').value='#'+selectedColor.slice(0,3).map(c=>c.toString(16).padStart(2,'0')).join('');
      document.querySelector('.color-btn.active')?.classList.remove('active');
      selectTool(previousPaintTool);
    }else if (pageReady && gesture.tool !== 'move' && valid(p) && layers?.active?.visible) {
      startStroke(); stroke(gesture.p, p);
    }
    if (gesture.changed) {
      undo.push(gesture.before);
      if (undo.length > maxSteps()) undo.shift();
      redo = [];
      notifyLayers();autoSaveCurrentPage();
      trackCompletedColoring(gesture);
    }
    gesture = null;
  }
  stage.addEventListener('pointerup', e => finish(e));
  stage.addEventListener('pointercancel', e => finish(e, true));
  stage.addEventListener('lostpointercapture', e => finish(e, true));
  stage.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
  art.addEventListener('dragstart', e => e.preventDefault());
  window.addEventListener('blur', () => {
    cancelStroke(); touches.clear(); pinch = null;
  });
  // Block the old tap handler: this replaces its input handling, not its coloring algorithm.
  art.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);

  // Capture original pixels whenever a new coloring-book image loads.
  function refreshOriginal() {
    if (!baseImage.complete || !baseImage.naturalWidth) return;
    cancelFloating(false);
    const temp = document.createElement('canvas');
    temp.width = baseImage.naturalWidth; temp.height = baseImage.naturalHeight;
    const tctx = temp.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(baseImage, 0, 0);
    originalPixels = tctx.getImageData(0,0,temp.width,temp.height);
    undo = []; redo = []; gesture = null; pinch = null; touches.clear();
    if (pendingInsert) {
      pendingInsert = null; mode = 'brush';
      tools.querySelector('[data-tool="brush"]').classList.add('active');
      window.dispatchEvent(new Event('farmsie-insert-ended'));
    }
    zoom = 1; panX = 0; panY = 0; renderView();
  }
  baseImage.addEventListener('load', refreshOriginal);
  if (baseImage.complete && baseImage.naturalWidth) refreshOriginal();
  renderView();
})();

<script>
(function() {

        if (action) {
            card.addEventListener('click', action);
        } else {
            card.disabled = true;
            card.style.opacity = '0.5';
        }

        grid.appendChild(card);
    }

function showCategories() {
    prepareScreen(
        'Sacred Grace Coloring',
        'Color, pray & reflect on Scripture',
        '← Continue Coloring',
        () => { menu.hidden = true; }
    );

    const homeTitle = menu.querySelector('h2');
    homeTitle.style.fontSize = 'clamp(32px, 8vw, 54px)';

    const wordSearch = document.createElement('a');
    wordSearch.href = 'word-search.html';
    wordSearch.className = 'sacred-word-search';

    grid.appendChild(wordSearch);

    const billboard = document.createElement('section');

    categories.forEach(category => {

        const count = collectionBooks.reduce((sum, book) => sum + book.pages.length, 0);
        if (!count) return;
        const button = document.createElement('button');
        button.type = 'button';

    billboard.appendChild(billboardCollections);
    grid.appendChild(billboard);
 const preview = document.createElement('section');
preview.style.cssText = `

        grid-column: 1 / -1;

             hidden

             aria-label="Public counts not connected">

    grid.appendChild(preview);

    const heading = document.createElement('h3');
    heading.textContent = 'Biblical Collections';
    heading.style.cssText =
        'grid-column:1 / -1; margin:0 0 12px;';
    grid.appendChild(heading);

    const categoryRow = document.createElement('div');

    padding-bottom: 12px;
    scroll-snap-type: x proximity;
`;
    grid.appendChild(categoryRow);

    categories.forEach(category => {
        const availableBooks = books.filter(
            book => book.category === category.id
        );

        createCard(
            category.name,
            availableBooks.length
                ? 'Open Collection'
                : 'Coming Soon',
            availableBooks.length
                ? pageImages[availableBooks[0].pages[0]]
                : null,
            availableBooks.length
                ? () => showBooks(category)
                : null
        );

        const card = grid.lastElementChild;
        card.style.scrollSnapAlign = 'start';
        card.style.overflowWrap = 'anywhere';
        categoryRow.appendChild(card);
    });

    // Read existing saved artwork without changing it.
    (async () => {
        const message = preview.querySelector('.preview-message');
        const image = preview.querySelector('img');

        try {
            await saveQueue;
            const db = await openProgressDB();

            // Try the current picture first, then other saved pages.
            const pages = [
                currentPage,
                ...Object.keys(pageImages)
                    .map(Number)
                    .filter(number => number !== currentPage)
            ];

            for (const number of pages) {
                if (!preview.isConnected) return;

                const saved = await new Promise((resolve, reject) => {
                    const transaction = db.transaction(
                        progressStoreName, 'readonly'
                    );
                    const request = transaction
                        .objectStore(progressStoreName)
                        .get(progressKey(number));

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                if (!saved?.png) continue;
                if (!preview.isConnected) return;

                const url = URL.createObjectURL(saved.png);
                image.onload = image.onerror = () => {
                    URL.revokeObjectURL(url);
                };
                image.src = url;
                image.hidden = false;
                image.style.display = 'block';
                 message.textContent = `Your saved coloring • ${pageDetails[number].name}`;
                image.style.cursor = 'pointer';
image.tabIndex = 0;
image.setAttribute('role', 'button');
image.setAttribute('aria-label', `Continue coloring ${pageDetails[number].name}`);

};

image.onclick = resumePicture;
image.onkeydown = event => {

        resumePicture();
    }
};
return;
            }

            message.textContent =

                'Your saved preview could not be loaded.';
            console.warn('Farmsie preview:', error);
        }
    })
();

                book.pages.length + ' Free Pictures',
                pageImages[book.pages[0]],
                () => showPictures(book)
            );

        });
    }

    // SCREEN 3: PICTURES
    function showPictures(book) {

        prepareScreen(
            book.title,
            'Choose a picture to color!',
            '← Back to Books',
            () => {
                const category = categories.find(
                    item => item.id === book.category
                );
                showBooks(category);
            }
        );

book.pages.forEach((pageNumber, index) => {
    createCard(
        pageDetails[pageNumber].name,
        '🎨 Start Coloring',
        pageImages[pageNumber],

    );
});

    document.head.appendChild(searchStyle);
    function normalizeSearch(value) {
        return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }
    function matchesPage(number, query) {
        const info = pageDetails[number];
        const haystack = normalizeSearch(info.name + ' ' + info.tags + ' ' + number);
        return normalizeSearch(query).trim().split(/\s+/).every(word => haystack.includes(word));
    }
    function updateSearch() {
        const query = search.value.trim();
        results.replaceChildren();
        results.hidden = !query;

                loadBookPage(number);
                menu.hidden = true;
            });
            results.appendChild(grid.lastElementChild);
        });
    }
    search.addEventListener('input', updateSearch);
    document.getElementById('farmsie-clear-search').addEventListener('click', () => {
        search.value = ''; updateSearch(); search.focus();
    });
    search.addEventListener('keydown', event => {
        if (event.key === 'Escape') { search.value = ''; updateSearch(); }
    });

    // Begin at the category selection screen.
    showCategories();

<script>
(() => {
    function makePanel(host, title, elements) {
        const items = elements.filter(Boolean);
        if (!host || !items.length) return;

        const panel = document.createElement('details');
        panel.className = 'farmsie-tool-panel';

        const summary = document.createElement('summary');
        summary.textContent = title;

        const content = document.createElement('div');
        content.className = 'farmsie-panel-content';

        panel.append(summary, content);
        host.appendChild(panel);

        items.forEach(element => content.appendChild(element));

        panel.addEventListener('toggle', () => {
            if (!panel.open) return;

            document.querySelectorAll(
                '.farmsie-tool-panel[open]'
            ).forEach(other => {
                if (other !== panel) other.open = false;
            });
        });
    }

    const bookTools = document.getElementById('farmsie-tools');
    const bookSize = document.getElementById('farmsie-brush-size');
    const bookColor = document.getElementById('farmsie-custom-color');

    makePanel(bookTools, 'Size', [
        bookSize?.closest('label')
    ]);

    makePanel(bookTools, 'Colors', [
        bookColor?.closest('label'),
        document.getElementById('palette-container')
    ]);

    const photoTools = document.querySelector('.farmsie-paint-tools');
    const photoSize = document.getElementById('farmsie-paint-size');
    const photoColor = document.getElementById('farmsie-paint-color');

    if (photoSize) {
        photoSize.setAttribute('aria-label', 'Brush size');
    }

    makePanel(photoTools, 'Size', [photoSize]);

    makePanel(photoTools, 'Colors', [
        photoColor?.closest('label')
    ]);

    document.addEventListener('click', event => {
        if (event.target.closest('.farmsie-tool-panel')) return;

        document.querySelectorAll(
            '.farmsie-tool-panel[open]'
        ).forEach(panel => {
            panel.open = false;
        });
    });
})();
</script>

<script>
// Adjustable, rate-limited painting feedback; coloring never depends on vibration.
(() => {
    const supported = typeof navigator.vibrate === 'function';
    const key = 'farmsie-paint-vibration';
    const levels = ['off', 'gentle', 'medium', 'strong'];
    const labels = { off: 'Off', gentle: 'Gentle', medium: 'Medium', strong: 'Strong' };
    let level = 'gentle';
    try {
        const saved = localStorage.getItem(key);
        if (levels.includes(saved)) level = saved;
    } catch (_) {}
    let lastPulse = -Infinity;
    let patternIndex = 0;
    // Browsers vary pulse duration, not the motor's physical amplitude.
    const patterns = {
        gentle: [8, 12, 6, 10],
        medium: [22, 30, 18, 26],
        strong: [45, 60, 35, 50]
    };
    const buttons = [];
    const continuousButtons = [];
    let continuous = false;
    let repeatTimer = null;
    function stopContinuous() {
        continuous = false;
        clearTimeout(repeatTimer);
        repeatTimer = null;
        stop();
        render();
    }
    function runContinuous() {
        clearTimeout(repeatTimer);
        if (!continuous || document.hidden || level === 'off') {
            stopContinuous();
            return;
        }
        // Repeat short patterns to respect browser duration limits.
        const pattern = level === 'strong' ? [1000]
            : Array.from({ length: 20 }, (_, i) =>
                i % 2 === 0 ? (level === 'gentle' ? 20 : 50)
                            : (level === 'gentle' ? 80 : 50));
        try {
            if (navigator.vibrate(pattern) === false) {
                stopContinuous();
                return;
            }
        } catch (_) {
            stopContinuous();
            return;
        }
        repeatTimer = setTimeout(runContinuous, 1000);
    }
    function stop() {
        if (supported) { try { navigator.vibrate(0); } catch (_) {} }
    }
    function render() {
        continuousButtons.forEach(button => {
            button.textContent = continuous ? 'Stop Vibration' : 'Start Vibration';
            button.setAttribute('aria-pressed', String(continuous));
        });
        buttons.forEach(button => {
            button.textContent = supported
                ? 'Vibration: ' + labels[level]
                : 'Vibration unavailable';
            button.setAttribute('aria-label', supported
                ? 'Vibration: ' + labels[level] + '. Tap for ' + labels[levels[(levels.indexOf(level) + 1) % levels.length]]
                : 'Vibration unavailable');
        });
    }
    window.farmsieHaptics = {
        pulse() {
            if (!supported || continuous || level === 'off' || document.hidden) return;
            const now = performance.now();
            if (now - lastPulse < 90) return;
            lastPulse = now;
            try { navigator.vibrate(patterns[level][patternIndex++ % patterns[level].length]); } catch (_) {}
        },
        stop
    };
    function addToggle(toolbar) {
        if (!toolbar) return;
        const button = document.createElement('button');
        button.type = 'button';
        button.disabled = !supported;
        button.title = supported
            ? 'Tap to cycle Gentle, Medium, Strong, and Off'
            : 'This browser does not support painting vibration';
        button.addEventListener('click', () => {
            stop();
            level = levels[(levels.indexOf(level) + 1) % levels.length];
            patternIndex = 0;
            lastPulse = -Infinity;
            try { localStorage.setItem(key, level); } catch (_) {}
            render();
            if (continuous) runContinuous();
            else window.farmsieHaptics.pulse(); // Preview the selected level.

        });
        buttons.push(button);
        toolbar.appendChild(button);
        const continuousButton = document.createElement('button');
        continuousButton.type = 'button';
        continuousButton.disabled = !supported;
        continuousButton.title = 'Run vibration without coloring; tap again to stop';
        continuousButton.addEventListener('click', () => {
            if (continuous) { stopContinuous(); return; }
            if (level === 'off') {
                level = 'gentle';
                try { localStorage.setItem(key, level); } catch (_) {}
            }
            continuous = true;
            render();
            runContinuous();
        });
        continuousButtons.push(continuousButton);
        toolbar.appendChild(continuousButton);
    }
    addToggle(document.getElementById('farmsie-tools'));
    addToggle(document.querySelector('.farmsie-paint-tools'));
    render();
    const stopPaintingPulse = () => { if (!continuous) stop(); };
    document.addEventListener('pointerup', stopPaintingPulse, true);
    document.addEventListener('pointercancel', stopPaintingPulse, true);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopContinuous(); });
    window.addEventListener('blur', stopContinuous);
    window.addEventListener('pagehide', stopContinuous);
})();
</script>

<script>
(() => {

 function arrange(){
  const exportHeight=Math.ceil(footer.getBoundingClientRect().height);

 if(window.ResizeObserver){const observer=new ResizeObserver(arrange);observer.observe(footer);observer.observe(tools);}

 window.addEventListener('resize',arrange);

})();

<script>
(() => {
 const tools=document.getElementById('farmsie-tools');
 const brush=tools.querySelector('[data-tool="brush"]'),erase=tools.querySelector('[data-tool="erase"]'),move=tools.querySelector('[data-tool="move"]'),undo=document.getElementById('farmsie-undo');
 function drawer(title,id){
  const d=document.createElement('details');d.className='farmsie-tool-panel';d.id=id;
  const summary=document.createElement('summary');summary.textContent=title;
  const content=document.createElement('div');content.className='farmsie-panel-content';
  d.append(summary,content);return {d,content};
 }
 const draw=drawer('🖌 Draw','farmsie-draw-drawer'),more=drawer('⋯ More','farmsie-more-drawer');
 const size=document.getElementById('farmsie-brush-size').closest('label');
 const color=document.getElementById('farmsie-custom-color').closest('label');
 const palette=document.getElementById('palette-container');
 draw.content.append(brush,...['pencil','crayon','highlighter','airbrush','eyedropper','smudge'].map(name=>tools.querySelector('[data-tool="'+name+'"]')),size,document.getElementById('farmsie-brush-opacity').closest('label'),color,palette);
 tools.querySelectorAll(':scope > .farmsie-tool-panel').forEach(d=>d.remove());
 const remaining=[...tools.children].filter(e=>![erase,move,undo].includes(e));
 more.content.innerHTML=`<h3>History, zoom & settings</h3><div id="farmsie-extra-controls"></div><h3>Save & activities</h3><div id="farmsie-export-controls"></div>`;
 more.content.querySelector('#farmsie-extra-controls').append(...remaining);
 for(const percent of [1000,2500,5000]){
  const b=document.createElement('button');b.type='button';b.textContent=percent.toLocaleString()+'% zoom';
  b.onclick=()=>window.farmsieSetZoom(percent);more.content.querySelector('#farmsie-extra-controls').append(b);
 }
 more.content.querySelector('#farmsie-export-controls').append(...document.querySelector('body > footer').children);
 tools.replaceChildren(draw.d,erase,move,undo,more.d);
 function close(){draw.d.open=false;more.d.open=false;}
 for(const d of [draw.d,more.d])d.addEventListener('toggle',()=>{if(d.open)(d===draw.d?more.d:draw.d).open=false;});
 document.getElementById('canvas-container').addEventListener('pointerdown',close,true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();brush.click();}});
 for(const button of [brush,erase,move,undo,...['pencil','crayon','highlighter','airbrush','eyedropper','smudge'].map(name=>tools.querySelector('[data-tool="'+name+'"]'))])button.addEventListener('click',close);
 window.dispatchEvent(new Event('resize'));
})();
</script>
