    <script>
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const canvas = document.getElementById('coloring-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let currentPage = 1;
        const totalPages = 12;
        const pageImages = {
    1: 'page1.png.png',
    2: 'page2.png.png',
    3: 'page3.png.png',
    4: 'page4.png.png',
    5: 'file_000000001b3481fdbc02a2d9d05c1c79.png',
    6: 'file_000000005e1c81fd9c6139b3a75bafb9.png',
    7: 'file_000000007c2481f7b7a44c4ff447159a.png',
    8: 'file_000000008b5c81fdb2bd03ef29090ca4.png',
    9: 'file_0000000094e481fda213fff909ca8e1a.png',
    10: 'file_00000000aeac81fd81d205f864f7cc03.png',
    11: 'file_00000000cbe081fdaed85612dcddcc47.png',
    12: 'file_00000000f66482308954ca8226960577.png'
};
        let selectedColor = [255, 59, 48, 255];
        const baseImage = new Image();
        let boundaryMask = null;
        let maskWidth = 0;
        let maskHeight = 0;

        function buildBoundaryMask() {
            const offscreen = document.createElement('canvas');
            offscreen.width = baseImage.width;
            offscreen.height = baseImage.height;
            const offCtx = offscreen.getContext('2d', { willReadFrequently: true });
            offCtx.drawImage(baseImage, 0, 0);

            const imgData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
            const data = imgData.data;
            const width = imgData.width;
            const height = imgData.height;
            const initialMask = new Uint8Array(width * height);

            // Detect dark outline pixels from the original line art.
            for (let i = 0; i < width * height; i++) {
                const idx = i * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const alpha = data[idx + 3];
                const brightness = (r + g + b) / 3;

                // Treat darker/gray anti-aliased pixels as boundaries too.
                if (alpha > 0 && brightness < 220) {
                    initialMask[i] = 1;
                }
            }

            // Expand boundary 1 pixel in every direction to seal tiny gaps.
            const expandedMask = new Uint8Array(initialMask);
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const pos = y * width + x;
                    if (initialMask[pos] === 1) {
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const nx = x + dx;
                                const ny = y + dy;
                                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                                    expandedMask[ny * width + nx] = 1;
                                }
                            }
                        }
                    }
                }
            }

            boundaryMask = expandedMask;
            maskWidth = width;
            maskHeight = height;
        }

        // Step 5: Keep each page's colored artwork in this browser's IndexedDB.
        // The original images remain in the repository; no server or account is required.
        const progressDBName = 'farmsie-progress-v1';
        const progressStoreName = 'pages';
        let progressDBPromise = null;
        let pageLoadGeneration = 0;
        let pageReady = false;
        let saveQueue = Promise.resolve();

        function progressKey(pageNumber) {
            // Changing an image filename starts fresh progress for that image.
            return `${pageNumber}|${pageImages[pageNumber]}`;
        }

        function openProgressDB() {
            if (!progressDBPromise) {
                progressDBPromise = new Promise((resolve, reject) => {
                    if (!('indexedDB' in window)) {
                        reject(new Error('Browser storage is unavailable'));
                        return;
                    }
                    const request = indexedDB.open(progressDBName, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(progressStoreName)) {
                            db.createObjectStore(progressStoreName);
                        }
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
            return progressDBPromise;
        }

        async function restorePageProgress(pageNumber, generation) {
            try {
                // Wait for earlier coloring taps to finish saving before restoring.
                await saveQueue;
                if (generation !== pageLoadGeneration) return;
                const db = await openProgressDB();
                const saved = await new Promise((resolve, reject) => {
                    const transaction = db.transaction(progressStoreName, 'readonly');
                    const request = transaction.objectStore(progressStoreName).get(progressKey(pageNumber));
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
                if (!saved || saved.width !== canvas.width || saved.height !== canvas.height) return;
                const bitmap = await createImageBitmap(saved.png);
                if (generation === pageLoadGeneration && currentPage === pageNumber) {
                    ctx.drawImage(bitmap, 0, 0);
                }
                bitmap.close();
            } catch (error) {
                console.warn('Farmsie: could not restore saved coloring progress:', error);
            }
        }

        function autoSaveCurrentPage() {
            if (!pageReady || !boundaryMask) return;
            const key = progressKey(currentPage);
            const width = canvas.width;
            const height = canvas.height;
            // Capture before navigating away; chain writes to preserve tap order.
            const pngPromise = new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
            saveQueue = saveQueue.catch(() => {}).then(async () => {
                const png = await pngPromise;
                if (!png) throw new Error('Could not snapshot canvas');
                const db = await openProgressDB();
                await new Promise((resolve, reject) => {
                    const transaction = db.transaction(progressStoreName, 'readwrite');
                    transaction.objectStore(progressStoreName).put({ png, width, height }, key);
                    transaction.oncomplete = resolve;
                    transaction.onerror = () => reject(transaction.error);
                    transaction.onabort = () => reject(transaction.error);
                });
            }).catch(error => {
                console.warn('Farmsie: automatic save unavailable:', error);
            });
        }

        function loadBookPage(num) {
            const category = num <= 4 ? 'faith' : 'animals';
const firstPage = category === 'faith' ? 1 : 5;

const unlockedThrough =
    window.farmsieUnlockedByCategory?.[category]
    ?? firstPage;

if (num > unlockedThrough) {
    alert('Complete the earlier challenges in this collection first.');
    num = unlockedThrough;
}

currentPage = num;
            window.farmsieCanPaint = false;
            window.farmsieLockChallenge?.(true);
            const generation = ++pageLoadGeneration;
            pageReady = false;
            boundaryMask = null;
            document.getElementById('page-title').innerText = `Page ${num} of ${totalPages}`;
            baseImage.onload = async () => {
                if (generation !== pageLoadGeneration) return;
                canvas.width = baseImage.width;
                canvas.height = baseImage.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(baseImage, 0, 0);
                buildBoundaryMask();
                await restorePageProgress(num, generation);
                if (generation === pageLoadGeneration) {
    pageReady = true;

    if (typeof window.umami?.track === 'function') {
        window.umami.track(`Picture ${num} loaded`);
    }
                }
            };
            baseImage.onerror = () => {
                if (generation === pageLoadGeneration) {
                    console.warn('Farmsie: could not load', pageImages[num]);
                }
            };
            baseImage.src = pageImages[num];
        }

        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const active = document.querySelector('.color-btn.active');
                if (active) active.classList.remove('active');
                e.target.classList.add('active');
                selectedColor = e.target.getAttribute('data-color').match(/\d+/g).map(Number);
            });
        });

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = totalPages;
            if (currentPage > totalPages) currentPage = 1;
            loadBookPage(currentPage);
        }

        function fillRegion(startX, startY, fillColor) {
            if (!boundaryMask || startX < 0 || startX >= maskWidth || startY < 0 || startY >= maskHeight) return;

            const startPos = startY * maskWidth + startX;
            if (boundaryMask[startPos] === 1) return; // Don't color black outlines.

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const startIdx = startPos * 4;

            // If already this exact fill color, do nothing.
            if (
                data[startIdx] === fillColor[0] &&
                data[startIdx + 1] === fillColor[1] &&
                data[startIdx + 2] === fillColor[2] &&
                data[startIdx + 3] === fillColor[3]
            ) {
                return;
            }

            const visited = new Uint8Array(maskWidth * maskHeight);
            const stack = [startPos];
            visited[startPos] = 1;

            while (stack.length > 0) {
                const pos = stack.pop();
                const x = pos % maskWidth;
                const y = (pos / maskWidth) | 0;
                const idx = pos * 4;

                // Only color non-boundary pixels.
                if (boundaryMask[pos] === 0) {
                    data[idx] = fillColor[0];
                    data[idx + 1] = fillColor[1];
                    data[idx + 2] = fillColor[2];
                    data[idx + 3] = fillColor[3];

                    const neighbors = [
                        pos - 1,
                        pos + 1,
                        pos - maskWidth,
                        pos + maskWidth
                    ];

                    for (const n of neighbors) {
                        if (n < 0 || n >= visited.length || visited[n] === 1 || boundaryMask[n] === 1) continue;

                        // Extra left/right edge protection.
                        if ((n === pos - 1 && x === 0) || (n === pos + 1 && x === maskWidth - 1)) continue;

                        visited[n] = 1;
                        stack.push(n);
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
            autoSaveCurrentPage();
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const startX = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
            const startY = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
            fillRegion(startX, startY, selectedColor);
        });

        // Export only the current coloring page, not the surrounding app interface.
        document.getElementById('save-picture-btn').addEventListener('click', () => {
            if (!canvas.width || !canvas.height || !boundaryMask) {
                alert('The coloring page is still loading. Please try again.');
                return;
            }

            canvas.toBlob((blob) => {
                if (!blob) {
                    alert('Could not create the picture. Please try again.');
                    return;
                }

                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Farmsie-Page-${currentPage}.png`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                // Keep the blob alive long enough for mobile browsers to begin downloading.
                setTimeout(() => URL.revokeObjectURL(url), 60000);
            }, 'image/png');
        });

        document.getElementById('buy-premium-btn').addEventListener('click', () => {
            if (tg) {
                tg.openLink('https://gumroad.com');
            } else {
                window.open('https://gumroad.com', '_blank');
            }
        });

        loadBookPage(currentPage);
    </script>

<script>
(() => {
  // Requires the working Step 5 Farmsie index.html, including IndexedDB autosave.
  const stage = document.getElementById('canvas-container');
  const art = document.getElementById('coloring-canvas');
  const tools = document.createElement('div');
  tools.id = 'farmsie-tools';
  tools.setAttribute('role', 'toolbar');
  tools.setAttribute('aria-label', 'Farmsie coloring tools');
  tools.innerHTML = `
    <button type="button" data-tool="brush" class="active">🖌 Brush</button>
    <button type="button" data-tool="erase">🧽 Eraser</button>
    <button type="button" data-tool="move">✋ Move</button>
    <label>Size <input id="farmsie-brush-size" type="range" min="1" max="40" value="3" step="1"></label>
    <label>🎨 <input id="farmsie-custom-color" aria-label="Choose a custom color" type="color" value="#ff3b30"></label>
    <button type="button" id="farmsie-undo">↶ Undo</button>
    <button type="button" id="farmsie-redo">↷ Redo</button>
    <button type="button" id="farmsie-reset">⟲ Reset</button>
    <button type="button" id="farmsie-zoomout">−</button>
    <button type="button" id="farmsie-zoom-label">100%</button>
    <button type="button" id="farmsie-zoomin">+</button>`;
  document.getElementById('palette-container').before(tools);

  let mode = 'brush';
  let zoom = 1, panX = 0, panY = 0;
  let undo = [], redo = [];
  let originalPixels = null;
  const touches = new Map();
  let gesture = null, pinch = null;

  const maxSteps = () => Math.max(1, Math.min(6,
    Math.floor(36 * 1024 * 1024 / Math.max(1, art.width * art.height * 4))));
  const snapshot = () => ctx.getImageData(0, 0, art.width, art.height);
  function beginChange() {
    undo.push(snapshot());
    if (undo.length > maxSteps()) undo.shift();
    redo = [];
  }
  function restore(state) {
    if (!state || state.width !== art.width || state.height !== art.height) return;
    ctx.putImageData(state, 0, 0);
    autoSaveCurrentPage();
  }
  tools.querySelector('#farmsie-undo').onclick = () => {
    if (!pageReady || !undo.length) return;
    redo.push(snapshot());
    restore(undo.pop());
  };
  tools.querySelector('#farmsie-redo').onclick = () => {
    if (!pageReady || !redo.length) return;
    undo.push(snapshot());
    restore(redo.pop());
  };
  tools.querySelector('#farmsie-reset').onclick = () => {
    if (!pageReady || !confirm('Erase all colors on this page? Other pages stay saved.')) return;
    beginChange();
    ctx.clearRect(0, 0, art.width, art.height);
    ctx.drawImage(baseImage, 0, 0);
    autoSaveCurrentPage();
  };
  tools.querySelector('#farmsie-custom-color').addEventListener('input', e => {
    const hex = e.target.value;
    selectedColor = [1, 3, 5].map(i => parseInt(hex.slice(i, i+2), 16)).concat(255);
    document.querySelector('.color-btn.active')?.classList.remove('active');
  });
  tools.querySelectorAll('[data-tool]').forEach(button => {
    button.onclick = () => {
      mode = button.dataset.tool;
      tools.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b === button));
    };
  });

  function limitPan() {
    const visible = 40;
    const width = art.clientWidth * zoom;
    const height = art.clientHeight * zoom;

    panX = Math.max(
        visible - width,
        Math.min(stage.clientWidth - visible, panX)
    );

    panY = Math.max(
        visible - height,
        Math.min(stage.clientHeight - visible, panY)
    );
  }
  function renderView() {
    limitPan();
    art.style.transformOrigin = '0 0';
    art.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    tools.querySelector('#farmsie-zoom-label').textContent = `${Math.round(zoom * 100)}%`;
  }
  function setZoom(next, focusX = stage.clientWidth / 2, focusY = stage.clientHeight / 2) {
    const z = Math.min(10, Math.max(0.1, next));
    panX = focusX - ((focusX - panX) / zoom) * z;
    panY = focusY - ((focusY - panY) / zoom) * z;
    zoom = z;
    renderView();
  }
  tools.querySelector('#farmsie-zoomin').onclick = () => setZoom(zoom * 1.5);
  tools.querySelector('#farmsie-zoomout').onclick = () => setZoom(zoom / 1.5);
  tools.querySelector('#farmsie-zoom-label').onclick = () => {
    zoom = 1; panX = 0; panY = 0; renderView();
  };

  function point(e) {
    const r = art.getBoundingClientRect();
    return { x: (e.clientX - r.left) * art.width / r.width,
             y: (e.clientY - r.top) * art.height / r.height };
  }
  function local(e) {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function valid(p) { return p.x >= 0 && p.y >= 0 && p.x < art.width && p.y < art.height; }

  // Brush and eraser draw continuously as the user slides a finger or stylus.
  // Black outlines are never overwritten, and eraser restores the original art.
  function stroke(from, to) {
    if (!pageReady || !boundaryMask || !originalPixels) return;
    const image = ctx.getImageData(0, 0, art.width, art.height);
    const d = image.data, o = originalPixels.data;
    const radius = Math.max(1, Number(tools.querySelector('#farmsie-brush-size').value)
      * art.width / stage.clientWidth / 2);
    const length = Math.hypot(to.x - from.x, to.y - from.y);
    const count = Math.max(1, Math.ceil(length / Math.max(1, radius / 2)));
    for (let j = 0; j <= count; j++) {
      const cx = from.x + (to.x - from.x) * j / count;
      const cy = from.y + (to.y - from.y) * j / count;
      for (let y = Math.max(0, Math.floor(cy - radius)); y <= Math.min(art.height-1, Math.ceil(cy+radius)); y++) {
        for (let x = Math.max(0, Math.floor(cx - radius)); x <= Math.min(art.width-1, Math.ceil(cx+radius)); x++) {
          if ((x-cx)**2 + (y-cy)**2 > radius*radius) continue;
          const n = y * art.width + x;
          if (boundaryMask[n]) continue;
          const k = n * 4;
          if (mode === 'erase') {
            d[k] = o[k]; d[k+1] = o[k+1];
            d[k+2] = o[k+2]; d[k+3] = o[k+3];
          } else {
            d[k] = selectedColor[0]; d[k+1] = selectedColor[1];
            d[k+2] = selectedColor[2]; d[k+3] = 255;
          }
        }
      }
    }
    ctx.putImageData(image, 0, 0);
  }

  function enterPinch() {
    if (touches.size < 2) return;
    if (gesture?.changed) autoSaveCurrentPage();
    gesture = null; // Pinching should not paint the picture.
    const p = [...touches.values()].slice(0, 2);
    pinch = { distance: Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y),
      zoom, panX, panY, center: {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2} };
  }
  art.addEventListener('pointerdown', e => {
    if (window.farmsieCanPaint !== true) {
        e.preventDefault();
        return;
    }
    if (!pageReady) return;
    e.preventDefault();
    art.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, local(e));
    if (touches.size >= 2) { enterPinch(); return; }
    gesture = {p: point(e), local: local(e), start: local(e), moved: false, changed: false};
  });
  art.addEventListener('pointermove', e => {
    if (!touches.has(e.pointerId)) return;
    e.preventDefault();
    touches.set(e.pointerId, local(e));
    if (touches.size >= 2 && pinch) {
      const p = [...touches.values()].slice(0,2);
      const mid = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2};
      const dist = Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      const z = Math.min(10, Math.max(0.1, pinch.zoom * dist / Math.max(1, pinch.distance)));
      zoom = z;
      panX = mid.x - (pinch.center.x - pinch.panX) * z / pinch.zoom;
      panY = mid.y - (pinch.center.y - pinch.panY) * z / pinch.zoom;
      renderView(); return;
    }
    if (!gesture) return;
    const here = point(e), loc = local(e);
    if (Math.hypot(loc.x - gesture.start.x,loc.y - gesture.start.y) > 7) gesture.moved = true;
    if (mode === 'move') {
      panX += loc.x - gesture.local.x;
      panY += loc.y - gesture.local.y;
      renderView();
    } else if ((mode === 'brush' || mode === 'erase') && valid(here)) {
      if (!gesture.changed) { beginChange(); gesture.changed = true; }
      stroke(gesture.p, here);
    }
    gesture.p = here; gesture.local = loc;
  });
  function finish(e, cancelled = false) {
    if (!touches.has(e.pointerId)) return;
    touches.delete(e.pointerId);
    if (pinch) {
      if (touches.size < 2) { pinch = null; gesture = null; }
      return;
    }
    if (!gesture) return;
    const p = point(e);
    if (!cancelled && pageReady && valid(p)) {
      if (mode === 'fill' && !gesture.moved && !boundaryMask[Math.floor(p.y)*art.width+Math.floor(p.x)]) {
        beginChange();
        fillRegion(Math.floor(p.x), Math.floor(p.y), selectedColor);
      } else if ((mode === 'brush' || mode === 'erase') && !gesture.changed) {
        beginChange(); stroke(p, p); gesture.changed = true;
      }
      if (gesture.changed) autoSaveCurrentPage();
    }
    gesture = null;
  }
  art.addEventListener('pointerup', e => finish(e));
  art.addEventListener('pointercancel', e => finish(e, true));
  // Block the old tap handler: this replaces its input handling, not its coloring algorithm.
  art.addEventListener('click', e => { e.preventDefault(); e.stopImmediatePropagation(); }, true);

  // Capture original pixels whenever a new coloring-book image loads.
  function refreshOriginal() {
    if (!baseImage.complete || !baseImage.naturalWidth) return;
    const temp = document.createElement('canvas');
    temp.width = baseImage.naturalWidth; temp.height = baseImage.naturalHeight;
    const tctx = temp.getContext('2d', { willReadFrequently: true });
    tctx.drawImage(baseImage, 0, 0);
    originalPixels = tctx.getImageData(0,0,temp.width,temp.height);
    undo = []; redo = []; gesture = null; pinch = null; touches.clear();
    zoom = 1; panX = 0; panY = 0; renderView();
  }
  baseImage.addEventListener('load', refreshOriginal);
  if (baseImage.complete && baseImage.naturalWidth) refreshOriginal();
  renderView();
})();
</script>

<script>
(function() {

    const menu = document.getElementById('farmsie-menu');
    const grid = document.getElementById('farmsie-picture-grid');
    const heading = menu.querySelector('h2');
    const description = menu.querySelector('p');

    // Replace the old back button so its previous
    // click handler does not interfere with navigation.
    const oldBack = document.getElementById('farmsie-back-btn');
    const back = oldBack.cloneNode(true);
    oldBack.replaceWith(back);

    // Categories available now or planned for later.
    const categories = [
        { id: 'faith', name: '✝️ Faith & Farm' },
        { id: 'animals', name: '🐮 Farm Animals' },
        { id: 'nature', name: '🌻 Nature & Gardens' }
    ];

    // Our first real coloring book.
    const books = [
    {
        title: 'My First Farmsie Coloring Book',
        category: 'faith',
        pages: [1, 2, 3, 4]
    },
    {
        title: 'Animal Adventures',
        category: 'animals',
        pages: [5, 6, 7, 8, 9, 10, 11, 12]
    }
];

    function prepareScreen(title, message, backText, backAction) {
        heading.textContent = title;
        description.textContent = message;
        grid.innerHTML = '';

        back.textContent = backText;
        back.onclick = backAction;
    }

    function createCard(title, subtitle, image, action) {

        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'farmsie-picture-card';

        if (image) {
            const picture = document.createElement('img');
            picture.src = image;
            picture.alt = title;
            card.appendChild(picture);
        }

        const name = document.createElement('span');
        name.textContent = title;
        card.appendChild(name);

        const info = document.createElement('span');
        info.textContent = subtitle;
        card.appendChild(info);

        if (action) {
            card.addEventListener('click', action);
        } else {
            card.disabled = true;
            card.style.opacity = '0.5';
        }

        grid.appendChild(card);
    }

function showCategories() {
    prepareScreen(
        'Farmsie',
        'Your coloring',
        '← Continue Coloring',
        () => { menu.hidden = true; }
    );

    const homeTitle = menu.querySelector('h2');
homeTitle.style.fontSize = 'clamp(36px, 9vw, 52px)';

// Restore the normal heading size when leaving the homepage.
const restoreTitleSize = () => {
    homeTitle.style.removeProperty('font-size');
};

menu.addEventListener('click', restoreTitleSize, { once: true });
 const preview = document.createElement('section');
preview.style.cssText = `

        grid-column: 1 / -1;
        width: 100%;
        max-width: 520px;
        margin: 0 auto 20px;
        overflow: hidden;
        background: #202124;
        border: 1px solid #414348;
        border-radius: 12px;
    `;

    preview.innerHTML = `
        <img alt="Your saved coloring"
             hidden
             style="display:none; width:100%; height:auto;">
        <p class="preview-message"
           style="padding:24px 16px;">
            Loading your saved coloring…
        </p>
        <div class="stats-bar"
             aria-label="Public counts not connected">
            <span>Likes —</span>
            <span>Views —</span>
        </div>
    `;

    grid.appendChild(preview);

    const heading = document.createElement('h3');
    heading.textContent = 'Categories';
    heading.style.cssText =
        'grid-column:1 / -1; margin:0 0 12px;';
    grid.appendChild(heading);

    const categoryRow = document.createElement('div');
categoryRow.style.cssText = `

    grid-column: 1 / -1;
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 150px;
    gap: 12px;
    min-width: 0;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 12px;
    scroll-snap-type: x proximity;
`;
    grid.appendChild(categoryRow);

    categories.forEach(category => {
        const availableBooks = books.filter(
            book => book.category === category.id
        );

        createCard(
            category.name,
            availableBooks.length
                ? 'Open Collection'
                : 'Coming Soon',
            availableBooks.length
                ? pageImages[availableBooks[0].pages[0]]
                : null,
            availableBooks.length
                ? () => showBooks(category)
                : null
        );

        const card = grid.lastElementChild;
        card.style.scrollSnapAlign = 'start';
        card.style.overflowWrap = 'anywhere';
        categoryRow.appendChild(card);
    });

    // Read existing saved artwork without changing it.
    (async () => {
        const message = preview.querySelector('.preview-message');
        const image = preview.querySelector('img');

        try {
            await saveQueue;
            const db = await openProgressDB();

            // Try the current picture first, then other saved pages.
            const pages = [
                currentPage,
                ...Object.keys(pageImages)
                    .map(Number)
                    .filter(number => number !== currentPage)
            ];

            for (const number of pages) {
                if (!preview.isConnected) return;

                const saved = await new Promise((resolve, reject) => {
                    const transaction = db.transaction(
                        progressStoreName, 'readonly'
                    );
                    const request = transaction
                        .objectStore(progressStoreName)
                        .get(progressKey(number));

                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });

                if (!saved?.png) continue;
                if (!preview.isConnected) return;

                const url = URL.createObjectURL(saved.png);
                image.onload = image.onerror = () => {
                    URL.revokeObjectURL(url);
                };
                image.src = url;
                image.hidden = false;
                image.style.display = 'block';
                 message.textContent = `Your saved coloring • Picture ${number}`;
                image.style.cursor = 'pointer';
image.tabIndex = 0;
image.setAttribute('role', 'button');
image.setAttribute('aria-label', `Continue coloring Picture ${number}`);

const resumePicture = () => {
    currentPage = number;
    loadBookPage(number);
    menu.hidden = true;
};

image.onclick = resumePicture;
image.onkeydown = event => {
    if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        resumePicture();
    }
};
return;
            }

            message.textContent =
                'Choose a picture below and start coloring. Your saved artwork will appear here.';
        } catch (error) {
            message.textContent =
                'Your saved preview could not be loaded.';
            console.warn('Farmsie preview:', error);
        }
    })
();
}

    // SCREEN 2: BOOKS
    function showBooks(category) {

        prepareScreen(
            category.name,
            'Choose a coloring book!',
            '← Back to Categories',
            showCategories
        );

        books.filter(
            book => book.category === category.id
        ).forEach(book => {

            createCard(
                book.title,
                book.pages.length + ' Free Pictures',
                pageImages[book.pages[0]],
                () => showPictures(book)
            );

        });
    }

    // SCREEN 3: PICTURES
    function showPictures(book) {

        prepareScreen(
            book.title,
            'Choose a picture to color!',
            '← Back to Books',
            () => {
                const category = categories.find(
                    item => item.id === book.category
                );
                showBooks(category);
            }
        );

book.pages.forEach((pageNumber, index) => {
    const firstPage = book.pages[0];

    const unlockedThrough =
        window.farmsieUnlockedByCategory?.[book.category]
        ?? firstPage;

    const locked = pageNumber > unlockedThrough;

    createCard(
        'Challenge ' + (index + 1),
        locked
            ? '🔒 Complete Challenge ' + index
            : '🎨 Start Challenge',
        pageImages[pageNumber],
        locked ? null : () => {
            currentPage = pageNumber;
            loadBookPage(pageNumber);
            menu.hidden = true;
        }
    );

    const card = grid.lastElementChild;

    if (locked) {
        card.style.opacity = '1';
        card.style.cursor = 'not-allowed';

        const picture = card.querySelector('img');
        if (picture) {
            picture.style.filter = 'blur(8px)';
        }

        card.setAttribute(
            'aria-label',
            'Challenge ' + (index + 1)
                + ' locked. Complete Challenge '
                + index + ' in this collection first.'
        );
    }
});
    }

    // Begin at the category selection screen.
    showCategories();

})();
</script>

<script>
(() => {

  const screen = document.getElementById(
    "farmsie-paint-screen"
  );

  const gallery = document.getElementById(
    "farmsie-menu"
  );

  const stage = document.getElementById(
    "farmsie-paint-stage"
  );

  const background = document.getElementById(
    "farmsie-paint-background"
  );

  const overlay = document.getElementById(
    "farmsie-paint-overlay"
  );

  const bg = background.getContext("2d");

  const paint = overlay.getContext("2d", {
    willReadFrequently: true
  });

  const color = document.getElementById(
    "farmsie-paint-color"
  );

  const size = document.getElementById(
    "farmsie-paint-size"
  );

  const status = document.getElementById(
    "farmsie-paint-status"
  );

  const SIZE = 900;

  background.width = SIZE;
  background.height = SIZE;

  overlay.width = SIZE;
  overlay.height = SIZE;

  let loaded = false;
  let drawing = false;
  let erasing = false;
  let lastPoint = null;

  const history = [];

  bg.fillStyle = "white";
  bg.fillRect(0, 0, SIZE, SIZE);

  // Add upload button to existing gallery.

  const openButton = document.createElement("button");

  openButton.id = "farmsie-upload-button";

  openButton.textContent = "📷 Paint Your Own Photo";

  gallery.querySelector(
    "#farmsie-picture-grid"
  ).before(openButton);

  openButton.onclick = () => {
    screen.hidden = false;
  };

  document.getElementById(
    "farmsie-paint-back"
  ).onclick = () => {
    screen.hidden = true;
  };

  // Upload picture.

  document.getElementById(
    "farmsie-photo-input"
  ).onchange = event => {

    const file = event.target.files[0];

    if (!file) return;

    const url = URL.createObjectURL(file);

    const image = new Image();

    image.onload = () => {

      bg.fillStyle = "white";
      bg.fillRect(0, 0, SIZE, SIZE);

      const scale = Math.min(
        SIZE / image.width,
        SIZE / image.height
      );

      const width = image.width * scale;
      const height = image.height * scale;

      const x = (SIZE - width) / 2;
      const y = (SIZE - height) / 2;

      bg.drawImage(
        image,
        x,
        y,
        width,
        height
      );

      paint.clearRect(0, 0, SIZE, SIZE);

      history.length = 0;

      loaded = true;

      status.textContent =
        "Photo loaded! Start painting.";

      URL.revokeObjectURL(url);
    };

    image.onerror = () => {
      status.textContent = "Could not open this picture.";
      URL.revokeObjectURL(url);
    };

    image.src = url;
  };

  // Painting controls.

  function getPoint(event) {

    const rect = overlay.getBoundingClientRect();

    return {
      x: (event.clientX - rect.left)
         * SIZE / rect.width,

      y: (event.clientY - rect.top)
         * SIZE / rect.height
    };
  }

  function saveUndo() {

    history.push(
      paint.getImageData(0, 0, SIZE, SIZE)
    );

    if (history.length > 6) {
      history.shift();
    }
  }

  function drawLine(from, to) {

    paint.save();

    paint.globalCompositeOperation =
      erasing ? "destination-out" : "source-over";

    paint.strokeStyle = color.value;

    paint.lineWidth =
  Number(size.value) *
  SIZE / stage.getBoundingClientRect().width;

    paint.lineCap = "round";
    paint.lineJoin = "round";

    paint.beginPath();

    paint.moveTo(from.x, from.y);

    paint.lineTo(to.x, to.y);

    paint.stroke();

    // Draw a dot for a single tap.
    if (from.x === to.x && from.y === to.y) {
      paint.fillStyle = color.value;
      paint.beginPath();
      paint.arc(
        to.x, to.y,
        paint.lineWidth / 2,
        0, Math.PI * 2
      );
      paint.fill();
    }

    paint.restore();
  }

  overlay.addEventListener("pointerdown", event => {

    if (!loaded) return;

    event.preventDefault();

    overlay.setPointerCapture(event.pointerId);

    saveUndo();

    drawing = true;
    lastPoint = getPoint(event);

    drawLine(lastPoint, lastPoint);
  });

  overlay.addEventListener("pointermove", event => {

    if (!drawing) return;

    event.preventDefault();

    const point = getPoint(event);

    drawLine(lastPoint, point);

    lastPoint = point;
  });

  function finishPainting() {
    drawing = false;
    lastPoint = null;
  }

  overlay.addEventListener(
    "pointerup", finishPainting
  );

  overlay.addEventListener(
    "pointercancel", finishPainting
  );

  document.getElementById(
    "farmsie-paint-brush"
  ).onclick = () => {
    erasing = false;
    status.textContent = "Brush selected.";
  };

  document.getElementById(
    "farmsie-paint-eraser"
  ).onclick = () => {
    erasing = true;
    status.textContent = "Eraser selected.";
  };

  document.getElementById(
    "farmsie-paint-undo"
  ).onclick = () => {

    if (!history.length) return;

    paint.putImageData(history.pop(), 0, 0);
  };

  document.getElementById(
    "farmsie-paint-clear"
  ).onclick = () => {

    if (!loaded) return;

    if (!confirm("Remove all paint from this photo?")) {
      return;
    }

    saveUndo();

    paint.clearRect(0, 0, SIZE, SIZE);
  };

  // Download the original photo with paint on top.

  document.getElementById(
    "farmsie-paint-save"
  ).onclick = () => {

    if (!loaded) {
      alert("Please upload a photo first.");
      return;
    }

    const result = document.createElement("canvas");

    result.width = SIZE;
    result.height = SIZE;

    const ctx = result.getContext("2d");

    ctx.drawImage(background, 0, 0);
    ctx.drawImage(overlay, 0, 0);

    result.toBlob(blob => {

      if (!blob) return;

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = "Farmsie-My-Artwork.png";

      document.body.appendChild(link);

      link.click();
      link.remove();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 60000);

      status.textContent = "Artwork saved!";
    }, "image/png");
  };

})();
</script>

<script>
(() => {

  const stage = document.getElementById(
    "farmsie-paint-stage"
  );

  const overlay = document.getElementById(
    "farmsie-paint-overlay"
  );

  if (!stage || !overlay) return;

  // Create a viewport around the painting canvas.

  const viewport = document.createElement("div");

  viewport.id = "farmsie-paint-viewport";

  stage.parentNode.insertBefore(viewport, stage);

  viewport.appendChild(stage);

  // Create zoom controls.

  const controls = document.createElement("div");

  controls.id = "farmsie-photo-zoom-controls";

  controls.innerHTML = `
    <button type="button" id="photo-zoom-in">
      🔍 +
    </button>

    <button type="button" id="photo-zoom-out">
      🔍 −
    </button>

    <button type="button" id="photo-zoom-reset">
      100%
    </button>

    <button type="button" id="photo-move">
      ✋ Move
    </button>

    <button type="button" id="photo-draw" class="active">
      🎨 Draw
    </button>
  `;

  viewport.before(controls);

  let zoom = 1;
  let panX = 0;
  let panY = 0;

  let moveMode = false;
  let dragging = false;
  let dragPointerId = null;

  let lastX = 0;
  let lastY = 0;

  const zoomIn = document.getElementById("photo-zoom-in");
  const zoomOut = document.getElementById("photo-zoom-out");
  const zoomReset = document.getElementById("photo-zoom-reset");
  const moveButton = document.getElementById("photo-move");
  const drawButton = document.getElementById("photo-draw");

  function limitPan() {

    const width = viewport.clientWidth;
    const height = viewport.clientHeight;

    panX = Math.max(
      width * (1 - zoom),
      Math.min(0, panX)
    );

    panY = Math.max(
      height * (1 - zoom),
      Math.min(0, panY)
    );
  }

  function updateView() {

    limitPan();

    stage.style.transform =
      `translate(${panX}px, ${panY}px) scale(${zoom})`;

    zoomReset.textContent =
      Math.round(zoom * 100) + "%";
  }

  function setZoom(nextZoom) {

    const oldZoom = zoom;

    const newZoom = Math.max(
  1,
  Math.min(10, nextZoom)
);

    const centerX = viewport.clientWidth / 2;
    const centerY = viewport.clientHeight / 2;

    panX = centerX -
      ((centerX - panX) / oldZoom) * newZoom;

    panY = centerY -
      ((centerY - panY) / oldZoom) * newZoom;

    zoom = newZoom;

    updateView();
  }

  zoomIn.onclick = () => {
    setZoom(zoom * 1.5);
  };

  zoomOut.onclick = () => {
    setZoom(zoom / 1.5);
  };

  zoomReset.onclick = () => {

    zoom = 1;
    panX = 0;
    panY = 0;

    updateView();
  };

  // Switch between moving and painting.

  moveButton.onclick = () => {

    moveMode = true;

    moveButton.classList.add("active");
    drawButton.classList.remove("active");
  };

  drawButton.onclick = () => {

    moveMode = false;

    drawButton.classList.add("active");
    moveButton.classList.remove("active");
  };

  // Capture movement before the normal painting handlers.
  // This prevents dragging from accidentally drawing.

  overlay.addEventListener("pointerdown", event => {

    if (!moveMode) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    dragging = true;
    dragPointerId = event.pointerId;

    lastX = event.clientX;
    lastY = event.clientY;

    overlay.setPointerCapture(event.pointerId);

  }, true);

  overlay.addEventListener("pointermove", event => {

    if (!moveMode) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if (!dragging || event.pointerId !== dragPointerId) {
      return;
    }

    panX += event.clientX - lastX;
    panY += event.clientY - lastY;

    lastX = event.clientX;
    lastY = event.clientY;

    updateView();

  }, true);

  function stopMoving(event) {

    if (!moveMode) return;

    event.preventDefault();
    event.stopImmediatePropagation();

    if (event.pointerId === dragPointerId) {
      dragging = false;
      dragPointerId = null;
    }
  }

  overlay.addEventListener("pointerup", stopMoving, true);

  overlay.addEventListener("pointercancel", stopMoving, true);

  updateView();

})();
</script>

            box.classList.remove('playing');

            const won = (player - computer + 3) % 3 === 1;
            const result = player === computer
                ? 'Draw! Try again.'
                : won ? 'You won!' : 'Computer wins. Try again.';

            message.textContent =
                `You: ${name}. Computer: ${choices[computer]}. ${result}`;

            if (won) {
                const start = document.createElement('button');
                start.type = 'button';
                start.textContent = 'Start coloring';
                start.style.cssText = button.style.cssText;
                controls.appendChild(start);

                start.onclick = () => {
    window.farmsieCanPaint = true;
    unlocked = true;
    box.style.display = 'none';
    start.remove();
    startColoringClock();
};
            } else {
                controls.querySelectorAll('button')
                    .forEach(b => b.disabled = false);
            }
        }, 1500);
    };
});

lockPage();
})();
</script>
</html>
